# PROD Profile - PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:host.docker.internal}:${DB_PORT:5432}/${DB_NAME:houseilladb}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Safe schema management for production environments
spring.jpa.hibernate.ddl-auto=update

# Disable verbose SQL logging in production to keep logs clean
spring.jpa.show-sql=false

# Production environment configuration profile variables
spring.mail.host=smtp.titan.email
spring.mail.port=587
spring.mail.username=info@houseilla.in
spring.mail.password=Eilla@2025
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

houseilla.allowed.origins=https://houseilla.in,http://houseilla.in

houseilla.jwt.secret=${JWT_SECRET_KEY}
houseilla.jwt.expiration-ms=86400000

