# Set the default active profile to dev
spring.profiles.active=dev

# Max size for a single file (e.g., 10MB)
spring.servlet.multipart.max-file-size=10MB

# Max size for the entire request (all files + the ID combined)
spring.servlet.multipart.max-request-size=50MB

