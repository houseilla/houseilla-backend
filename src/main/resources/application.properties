# Set the default active profile to dev
spring.profiles.active=dev

# Max size for a single file (e.g., 10MB)
spring.servlet.multipart.max-file-size=10MB

# Max size for the entire request (all files + the ID combined)
spring.servlet.multipart.max-request-size=50MB

# Excludes the default Spring Security User Details auto-generator to stop generating random passwords on boot
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Silences "spring.jpa.open-in-view is enabled by default" warning
spring.jpa.open-in-view=false

# Hides non-critical Hibernate schema/dialect startup warnings
logging.level.org.hibernate.orm.deprecation=ERROR
logging.level.org.hibernate.engine.jdbc.env.internal=ERROR



