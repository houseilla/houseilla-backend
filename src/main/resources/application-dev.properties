# DEV Profile - Local H2 File Database Configuration
spring.datasource.url=jdbc:h2:file:~/IdeaProjects/houseilla/testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 console for local debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Hibernate settings for local development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

houseilla.allowed.origins=http://localhost:8100,http://localhost:5173

houseilla.jwt.secret=9a4f2c8d3e1b7f6a5c4d3b2a1e0f9c8b7a6f5e4d3c2b1a0e9d8c7b6a5f4e3d2c
houseilla.jwt.expiration-ms=86400000




